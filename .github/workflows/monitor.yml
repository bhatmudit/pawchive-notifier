name: Pawchive monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      notify_existing:
        description: "Send notifications for existing posts during bootstrap"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pawchive-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.notify_existing }}" = "true" ]; then
              python src/main.py --notify-existing
            else
              python src/main.py --no-notify-existing
            fi
          else
            python src/main.py
          fi

      - name: Commit state
        if: always()
        run: |
          if git diff --quiet -- data/state.json; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+users.noreply.github.com"

          git add data/state.json
          git commit -m "Update Pawchive monitor state"
          git push
