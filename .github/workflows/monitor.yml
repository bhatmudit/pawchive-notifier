name: Pawchive monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      notify_existing:
        description: "Send notifications for existing posts during bootstrap"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pawchive-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Run monitor
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.notify_existing }}" = "true" ]; then
              python src/main.py --notify-existing
            else
              python src/main.py --no-notify-existing
            fi
          else
            python src/main.py
          fi

      - name: Commit state
        if: always()
        run: |
          if [ ! -f data/state.json ]; then
            exit 0
          fi

          # Every run touches last_run_at/total_runs, which would otherwise
          # produce a commit every 10 minutes forever. Only commit when
          # something that actually matters (posts, failure state, digest
          # history, ...) changed.
          if git cat-file -e HEAD:data/state.json 2>/dev/null; then
            git show HEAD:data/state.json | jq 'del(.meta.last_run_at, .meta.total_runs)' > /tmp/previous.json
            jq 'del(.meta.last_run_at, .meta.total_runs)' data/state.json > /tmp/current.json
            if diff -q /tmp/previous.json /tmp/current.json > /dev/null; then
              echo "No meaningful state change; skipping commit."
              exit 0
            fi
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "Update Pawchive monitor state"
          git push
